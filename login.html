<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>login | MediTrack</title><link rel="stylesheet" href="styles.css"><style>body{background:linear-gradient(135deg,#eff7f2,#f7f8f6 55%,#e7f0ec)}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,460px);padding:30px;background:#fff;border:1px solid var(--border);border-radius:18px}.auth-card form{display:grid;gap:12px}.auth-card input,.auth-card select{width:100%;min-height:46px}.auth-error{color:#a33}</style><script src="config.js"></script><script src="auth.js" defer></script></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">✚</span><span>MediTrack</span></a><form data-auth="login"><p class="eyebrow">Sign in</p><h1>Sign in</h1><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required<p id="auth-error" class="auth-error" role="alert"></p><button class="button primary" type="submit">Sign In</button><a href="register.html">Create an account</a><a href="index.html">Back to home</a></form></section></main></body></html>
