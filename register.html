<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>register | MediTrack</title><link rel="stylesheet" href="styles.css"><style>body{background:linear-gradient(135deg,#eff7f2,#f7f8f6 55%,#e7f0ec)}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,460px);padding:30px;background:#fff;border:1px solid var(--border);border-radius:18px}.auth-card form{display:grid;gap:12px}.auth-card input,.auth-card select{width:100%;min-height:46px}.auth-error{color:#a33}</style><script src="config.js"></script><script src="auth.js" defer></script></head><body><main class="auth-shell"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">✚</span><span>MediTrack</span></a><form data-auth="register"><p class="eyebrow">Get started</p><h1>Get started</h1><label for="name">Full name</label><input id="name" maxlength="80" autocomplete="name" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><label for="role">Account type</label><select id="role"><option value="PATIENT">Patient</option><option value="CAREGIVER">Caregiver</option></select><p id="auth-error" class="auth-error" role="alert"></p><button class="button primary" type="submit">Create Account</button><a href="login.html">Already have an account? Sign in</a><a href="index.html">Back to home</a></form></section></main></body></html>
